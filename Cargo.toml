[package]
name = "infuse_decoder"
version = "1.11.0"
edition = "2024"

[[bin]]
name = "infuse_decoder_cli"
path = "src/main_cli.rs"

[[bin]]
name = "infuse_decoder"
path = "src/main_gui.rs"

[dependencies]
byteorder = "1.5.0"
chrono = "0.4.45"
clap = { version = "4.6.10", features = ["derive"] }
eframe = "0.37.0"
indicatif = "0.18.6"
itertools = "0.15.0"
memmap = "0.7.0"
num_cpus = "1.17.0"
arrow-array = "60.2.0"
arrow-schema = "60.2.0"
parquet = "60.2.0"
prettytable-rs = "0.10.0"
regex = "1.13.2"
rfd = "0.18.0"
tdf = { path = "tdf" }
blocks = { path = "blocks" }
egui_extras = "0.37.0"
directories = "6.0.0"
image = "0.25.9"
itoa = "1.0.19"
memchr = "2.8.3"

[target.'cfg(windows)'.dependencies]
winapi = { version = "*", features = ["winbase"] }

[dev-dependencies]
arrow-select = "60.2.0"
